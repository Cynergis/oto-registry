name: pack tests

# A pack that carries code (its ontology's code/, loaded through `provides`) carries its tests too,
# under packs/<name>/tests with a conftest that points the engine at the pack. They run here against
# the engine the index names, on every push to the default branch and every pull request, so a pack
# whose adapter or command breaks on the engine is caught before it is installed. A pack with no
# tests/ is skipped.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reach the engine repository when it is private
        run: if [ -n "$OTO_ENGINE_TOKEN" ]; then git config --global url."https://x-access-token:${OTO_ENGINE_TOKEN}@github.com/".insteadOf "https://github.com/"; fi
        env:
          OTO_ENGINE_TOKEN: ${{ secrets.OTO_ENGINE_TOKEN }}
      - name: Install the engine from its repository
        run: python -m pip install "oto-kg @ git+${ENGINE}" pytest
        env:
          ENGINE: ${{ vars.OTO_ENGINE || 'https://github.com/Cynergis/oto' }}
      - name: Every pack with tests passes them
        run: |
          status=0
          for tests in packs/*/tests; do
            [ -d "$tests" ] || continue
            echo "== $tests"
            (cd "$(dirname "$tests")" && python -m pytest tests -q -p no:cacheprovider) || status=1
          done
          exit $status
